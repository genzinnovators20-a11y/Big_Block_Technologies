##
## Big Block Technologies — Nginx site configuration
##
## Serves the Vite production build as static files. Copy to
## /etc/nginx/sites-available/bigblock.conf, symlink into sites-enabled,
## then `nginx -t && systemctl reload nginx`.
##
## TLS below assumes certificates issued by certbot. Run
## `certbot --nginx -d example.com -d www.example.com` and certbot will
## fill in the certificate paths itself.
##

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name bigblocktechnologies.com www.bigblocktechnologies.com;

    # Leave the ACME challenge path reachable over HTTP for renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bigblocktechnologies.com www.bigblocktechnologies.com;

    ssl_certificate     /etc/letsencrypt/live/bigblocktechnologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bigblocktechnologies.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /var/www/bigblock/dist;
    index index.html;

    # ---------------------------------------------------------------- Security
    add_header X-Content-Type-Options   "nosniff"        always;
    add_header X-Frame-Options          "SAMEORIGIN"     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), camera=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The build ships no inline scripts and loads nothing from a third-party
    # origin, so a strict policy holds. `unsafe-inline` for styles is required
    # by Emotion, which injects the MUI stylesheet at runtime.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ------------------------------------------------------------- Compression
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      image/svg+xml application/manifest+json;

    # Serve pre-compressed .br / .gz files when the module is available.
    # brotli            on;
    # brotli_comp_level 6;
    # brotli_types      text/plain text/css application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------ Static assets
    # Vite fingerprints every file in /assets, so they are safe to cache
    # permanently. A new release produces new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /brand/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location = /sitemap.xml { expires 1d; access_log off; }
    location = /robots.txt  { expires 1d; access_log off; }

    # ------------------------------------------------------------------ Backend
    # Uncomment once an API service is running. The frontend calls the paths
    # under /api (contact form, assistant); credentials live only in that
    # service, never in the browser bundle.
    #
    # location /api/ {
    #     proxy_pass         http://127.0.0.1:3001/;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 30s;
    # }

    # -------------------------------------------------------------- SPA routing
    # Client-side routes such as /services or /blog/<slug> have no file on disk,
    # so anything not matching a real file falls through to index.html and the
    # router resolves it. index.html itself must never be cached, or visitors
    # keep loading the previous release's asset references.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Do not serve dotfiles.
    location ~ /\. {
        deny all;
    }
}
